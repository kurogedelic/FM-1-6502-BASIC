name: C host checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  host-tests:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
    steps:
      - uses: actions/checkout@v4
      - name: Compile and run host tests
        run: make clean test smoke CC=${{ matrix.compiler }} CFLAGS="-std=c99 -Wall -Wextra -Werror -Wpedantic -O2"
  console-rom:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install cc65
        run: sudo apt-get update && sudo apt-get install -y cc65
      - name: Assemble and execute console ROM
        run: |
          make build/runner console-rom
          python3 tests/test_console.py
  cpu-functional:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Klaus Dormann 6502 functional test (downloaded, checksum pinned)
        run: make cpu-functional CFLAGS="-std=c99 -Wall -Wextra -Werror -Wpedantic -O2"
  basic-rom:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install cc65
        run: sudo apt-get update && sudo apt-get install -y cc65
      - name: Build Microsoft BASIC ROM and run integration tests
        run: |
          ca65 --version
          make clean build/runner basic-rom
          python3 tests/test_basic.py
      - name: Upload ROM and link map
        uses: actions/upload-artifact@v4
        with:
          name: fm1-basic-rom
          path: |
            build/basic.bin
            build/basic.map
  sanitizers:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Address and undefined behavior sanitizers
        run: make clean test smoke CC=clang CFLAGS="-std=c99 -Wall -Wextra -Werror -O1 -g -fno-omit-frame-pointer -fsanitize=address,undefined"
  static-analysis:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install cppcheck
        run: sudo apt-get update && sudo apt-get install -y cppcheck
      - name: Cppcheck
        run: cppcheck --error-exitcode=1 --enable=warning,performance,portability --std=c99 --inline-suppr src tests
