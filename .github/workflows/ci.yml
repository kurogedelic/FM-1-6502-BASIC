name: C host checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  host-tests:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
    steps:
      - uses: actions/checkout@v4
      - name: Compile and run host tests
        run: make clean test smoke CC=${{ matrix.compiler }} CFLAGS="-std=c99 -Wall -Wextra -Werror -Wpedantic -O2"
  console-rom:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install cc65
        run: sudo apt-get update && sudo apt-get install -y cc65
      - name: Assemble console ROM
        run: make console-rom
      - name: Check ROM size and vectors
        run: |
          test "$(wc -c < build/console.bin)" -eq 32768
          python3 - <<'PY'
          from pathlib import Path
          rom = Path("build/console.bin").read_bytes()
          assert rom[0x7ffc:0x7ffe] == bytes([0, 0x80]), "reset vector must be $8000"
          PY
  sanitizers:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Address and undefined behavior sanitizers
        run: make clean test smoke CC=clang CFLAGS="-std=c99 -Wall -Wextra -Werror -O1 -g -fno-omit-frame-pointer -fsanitize=address,undefined"
  static-analysis:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install cppcheck
        run: sudo apt-get update && sudo apt-get install -y cppcheck
      - name: Cppcheck
        run: cppcheck --error-exitcode=1 --enable=warning,performance,portability --std=c99 --inline-suppr src tests
