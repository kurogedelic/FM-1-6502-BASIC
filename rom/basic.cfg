# FM-1 BASIC memory map
#   $0000-$008B  BASIC zero page (ZEROPAGE segment of m6502-min.s)
#   $0100-$01FF  6502 stack / BASIC number-formatting buffer
#   $0200-$02FF  BASIC input line buffer
#   $0300-$03FF  platform ("kernal") variables
#   $0400-$7FFF  BASIC program/variable RAM (found by BASIC's RAM probe)
#   $8000-$FFBF  ROM: BASIC code, then platform layer
#   $D000-$D001  virtual terminal I/O (overrides ROM; never read as code)
#   $FFC0-$FFE9  platform jump table (the entry points BASIC expects)
#   $FFFA-$FFFF  6502 vectors
MEMORY {
    ZEROPAGE: start = $0000, size = $0100, file = "";
    KRAM:     start = $0300, size = $0100, file = "";
    ROM:      start = $8000, size = $7FC0, type = ro, file = %O, fill = yes, fillval = $FF;
    KJUMP:    start = $FFC0, size = $002A, type = ro, file = %O, fill = yes, fillval = $FF;
    GAP:      start = $FFEA, size = $0010, type = ro, file = %O, fill = yes, fillval = $FF;
    VECTORS:  start = $FFFA, size = $0006, type = ro, file = %O;
}
SEGMENTS {
    ZEROPAGE: load = ZEROPAGE, type = rw;
    CODE:     load = ROM,      type = ro;
    KERNAL:   load = ROM,      type = ro;
    KBSS:     load = KRAM,     type = bss;
    KJUMP:    load = KJUMP,    type = ro;
    VECTORS:  load = VECTORS,  type = ro;
}
